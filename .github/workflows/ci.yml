name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The vendored alacritty_terminal fork keeps upstream formatting and lints, so only our crates are checked.
      - run: cargo fmt -p tb -p finder-core --check
      - run: cargo clippy --no-deps -p tb -p finder-core --all-targets -- -D warnings
      - run: cargo test --workspace

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
