# Publishes site/ to https://hugegene.github.io/termos/, with the README's demo GIF and the social-preview image
# copied in at deploy time. Plan: docs/plans/2026-11-13-github-pages.md.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/demo-short.gif"
      - "docs/images/social-preview.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/images/demo-short.gif docs/images/social-preview.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
