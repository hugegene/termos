name: Release

# Pushing a tag such as v0.2.0 builds tos for each target and publishes a GitHub release with the tarballs,
# their .sha256 files and install.sh. See docs/plans/2026-11-09-distribution.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          # Linux builds run on 22.04, so the binary needs no newer glibc than 22.04 has.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo build --release --locked -p tos --target ${{ matrix.target }}
      - run: cargo about generate about.hbs -o THIRD_PARTY_NOTICES.md
      # Also checks that the tag matches `tos --version`, and that the binary runs on this runner.
      - run: scripts/package.sh ${{ matrix.target }} "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: tos-${{ matrix.target }}
          path: dist/tos-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  release:
    needs: [build, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* scripts/install.sh
          --title "termos ${GITHUB_REF_NAME#v}: a terminal OS" --generate-notes
