[workspace]
resolver = "3"
members = ["crates/tb", "crates/finder-core", "crates/alacritty_terminal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
finder-core = { path = "crates/finder-core" }
alacritty_terminal = "=0.26.0"
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["serde"] }
csv = "1.4"
htmd = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
log = "0.4"
notify = "8"
postcard = { version = "1", features = ["use-std"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
rustix = { version = "1", features = ["process", "net", "fs", "termios", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"
tempfile = "3"

# Our fork (crates/alacritty_terminal/UPSTREAM.md) replaces the crates.io release everywhere.
[patch.crates-io]
alacritty_terminal = { path = "crates/alacritty_terminal" }

[profile.release]
lto = "thin"
