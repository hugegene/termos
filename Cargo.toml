[workspace]
resolver = "3"
members = ["crates/tos", "crates/finder-core", "crates/alacritty_terminal"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
finder-core = { path = "crates/finder-core" }
alacritty_terminal = "=0.26.0"
anyhow = "1"
base64 = "0.23"
# Spreadsheets. Its `dates` feature (chrono) isn't needed: date cells come back as dates without it.
calamine = "0.38"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["serde"] }
csv = "1.4"
htmd = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "pnm"] }
libc = "0.2"
log = "0.4"
notify = "8"
postcard = { version = "1", features = ["use-std"] }
pulldown-cmark = { version = "0.13", default-features = false }
# docx and pptx are zip files of XML; these are the versions calamine uses, so nothing extra is built.
quick-xml = "0.42"
ratatui = "0.30"
rustix = { version = "1", features = ["process", "net", "fs", "termios", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"

# Our fork (crates/alacritty_terminal/UPSTREAM.md) replaces the crates.io release everywhere.
[patch.crates-io]
alacritty_terminal = { path = "crates/alacritty_terminal" }

[profile.release]
lto = "thin"
# Drops the symbol table (3.1 MB). Our panic messages keep their file paths (docs/findings/2026-11-09-release-binary-contents.md).
strip = true
