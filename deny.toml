# License and source policy (rebuild plan §7). Run: cargo deny check
# Anything not in `allow` fails, including MPL-2.0: review it, then add a per-crate exception.

[graph]
all-features = false

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are `publish = false` (MIT, see LICENSE), so cargo-deny skips them.
ignore = true

[bans]
multiple-versions = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
