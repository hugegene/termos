# yazi config for the finder's left pane only (loaded via YAZI_CONFIG_HOME).
# Your normal ~/.config/yazi is untouched.

[mgr]
# parent | current | preview — preview column hidden; the right zellij pane does previews.
ratio = [1, 3, 0]
sort_dir_first = true

[plugin]
# Nothing to preview in a zero-width column, so skip the work entirely.
previewers = []
preloaders = []
